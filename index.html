<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iWriter</title>
  
  <!-- Favicon para a aba do navegador -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="shortcut icon" href="icon-192.png" type="image/png">
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="logo.svg" alt="Logo iWriter" class="app-logo">
      <span class="app-title">iWriter</span>
    </div>
    <button id="theme-toggle" class="icon-btn" aria-label="Modo Claro/Escuro">
      <!-- Ícone de Lua -->
      <svg class="moon-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <!-- Ícone de Sol -->
      <svg class="sun-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </header>

  <main class="app-main">
    <div class="card-container">
      <div id="card-content" class="card-text">Carregando conselhos...</div>
    </div>
    <div class="actions-container">
      <button id="copy-btn" class="action-btn" aria-label="Copiar verbete">
        <!-- Ícone de mãozinha -->
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8H9.5a5.5 5.5 0 0 1-4.82-2.83l-1.35-2.7a1.5 1.5 0 0 1 .47-1.84l1.62-1.21a1.5 1.5 0 0 1 1.77.16L9 14"></path></svg>
      </button>
      <button id="next-btn" class="action-btn" aria-label="Próximo verbete">
        <!-- Ícone de seta -->
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>
  </main>

  <div id="toast" class="toast">Copiado para a área de transferência!</div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.log('Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>
